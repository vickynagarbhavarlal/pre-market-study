<!-- INWEALFONEY PRE-MARKET COMPONENT -->
<div id="inwealfoney-premarket-loader" style="min-height:260px;display:flex;align-items:center;justify-content:center;padding:40px;font-family:Arial,sans-serif;color:#64748b;text-align:center;">
  Loading today's Pre-Market Study…
</div>

<style data-inwealfoney-premarket="true">
/* WordPress-safe overrides: keep the site's theme, but isolate the study */
#inwealfoney-premarket-content .brand{display:none !important;}
#inwealfoney-premarket-content .hero h1,
#inwealfoney-premarket-content h1{color:#60a5fa !important;}
#inwealfoney-premarket-content .hero h1 span{color:#60a5fa !important;}
#inwealfoney-premarket-content .hero{color:#fff !important;}
</style>

<script>
(function(){
  var loader=document.getElementById('inwealfoney-premarket-loader');
  if(!loader) return;

  var api='https://api.github.com/repos/vickynagarbhavarlal/pre-market-study/contents/?ref=main';

  function loadScript(oldScript){
    var s=document.createElement('script');
    if(oldScript.src){s.src=oldScript.src;}else{s.textContent=oldScript.textContent;}
    document.body.appendChild(s);
  }

  function injectPage(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var host=document.createElement('div');
    host.id='inwealfoney-premarket-content';

    doc.querySelectorAll('style').forEach(function(style){
      var css=document.createElement('style');
      css.setAttribute('data-inwealfoney-premarket','true');
      css.textContent=style.textContent;
      document.head.appendChild(css);
    });

    Array.from(doc.body.children).forEach(function(node){
      if(node.tagName.toLowerCase()!=='script') host.appendChild(document.importNode(node,true));
    });

    loader.replaceWith(host);

    /* Remove the branding line because WordPress already displays the INWEALFONEY brand */
    host.querySelectorAll('.brand').forEach(function(el){el.remove();});

    /* Prevent the WordPress theme from changing the hero title colour */
    host.querySelectorAll('.hero h1, .hero h1 span').forEach(function(el){
      el.style.setProperty('color','#60a5fa','important');
    });

    doc.querySelectorAll('script').forEach(loadScript);
  }

  fetch(api,{cache:'no-store'})
    .then(function(r){if(!r.ok) throw new Error('GitHub directory unavailable');return r.json();})
    .then(function(files){
      var dated=files.map(function(x){
        var m=x.name.match(/^(\d{2})-(\d{2})-(\d{4})\.html$/);
        if(!m) return null;
        return {name:x.name,date:new Date(Number(m[3]),Number(m[2])-1,Number(m[1]))};
      }).filter(Boolean).sort(function(a,b){return b.date-a.date;});

      if(!dated.length) throw new Error('No dated study found');

      var latest=dated[0].name;
      var raw='https://raw.githubusercontent.com/vickynagarbhavarlal/pre-market-study/main/'+latest+'?v='+Date.now();

      return fetch(raw,{cache:'no-store'}).then(function(r){
        if(!r.ok) throw new Error('Study unavailable');
        return r.text();
      });
    })
    .then(injectPage)
    .catch(function(e){
      loader.innerHTML='<div><strong>Pre-Market Study temporarily unavailable.</strong><br>Please refresh the page.</div>';
      console.error('INWEALFONEY Pre-Market:',e);
    });
})();
</script>
