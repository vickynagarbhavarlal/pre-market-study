<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INWEALFONEY — Pre-Market Study</title>
<style>html,body{margin:0;padding:0;background:#f5f7fb;font-family:Arial,sans-serif}#loading{min-height:100vh;display:grid;place-items:center;color:#64748b;font-size:15px}</style>
</head>
<body>
<div id="loading">Loading today's INWEALFONEY Pre-Market Study…</div>
<script>
(async function(){
  try {
    const url='https://raw.githubusercontent.com/vickynagarbhavarlal/pre-market-study/main/21-08-2026.html?x='+Date.now();
    const response=await fetch(url,{cache:'no-store'});
    if(!response.ok) throw new Error('Unable to load study');
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('loading').innerHTML='<div style="text-align:center;padding:30px">Pre-Market Study is temporarily unavailable.<br>Please refresh the page.</div>';
  }
})();
</script>
</body>
</html>
